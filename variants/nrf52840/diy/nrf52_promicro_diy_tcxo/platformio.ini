; Promicro + E22(0)-xxxM / HT-RA62 modules board variant - DIY - with TCXO
[env:nrf52_promicro_diy_tcxo]
custom_meshtastic_hw_model = 63
custom_meshtastic_hw_model_slug = NRF52_PROMICRO_DIY
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = NRF52 Pro-micro DIY
custom_meshtastic_images = promicro.svg
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
debug_tool = jlink

; NRF52 ProMicro w/ E-Ink display
[env:nrf52_promicro_diy-inkhud]
board_level = extra
extends = nrf52840_base, inkhud
board = promicro-nrf52840
build_flags =
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52840_base.lib_deps}
extra_scripts =
  ${nrf52840_base.extra_scripts}
  variants/nrf52840/diy/nrf52_promicro_diy_tcxo/custom_build_tasks.py ; Add to PIO's Project Tasks pane: preset builds for common displays

; Standalone utility (NOT the Meshtastic app): update the LR1121's own on-chip firmware.
; See tools/lr1121_fw_update/main.cpp and .notes/hardware/lr1121-tcxo-hang/ for context.
; Build/upload: pio run -e lr1121_fw_update -t upload
[env:lr1121_fw_update]
board_level = extra
extends = nrf52840_base
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
; This tiny tool doesn't need whole-image LTO (flash headroom isn't a concern here), and
; since it excludes the full app's BLE/softdevice sources, SWI2_EGU2_IRQHandler's real owner
; was never compiled in at all - nrf52_lto.py's ISR-survival guard (built for the full
; Meshtastic app's fixed ISR set) doesn't apply here, so skip that script entirely.
build_unflags = -flto
extra_scripts =
  ${env.extra_scripts}
  extra_scripts/nrf52_extra.py
build_src_filter = -<*> +<../tools/lr1121_fw_update/main.cpp> +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo/variant.cpp>
lib_deps =
  # renovate: datasource=github-tags depName=RadioLib packageName=jgromes/RadioLib
  https://github.com/jgromes/RadioLib/archive/6d8934836678d8894e3d556550475b37dce3e2b6.zip
debug_tool = jlink

; Standalone utility (NOT the Meshtastic app, NOT destructive - no firmware writes): probes
; whether XTAL mode fails reliably on a module that actually has a TCXO fitted.
; See tools/lr1121_osc_probe/main.cpp.
; Build/upload: pio run -e lr1121_osc_probe -t upload
[env:lr1121_osc_probe]
board_level = extra
extends = nrf52840_base
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
build_unflags = -flto
extra_scripts =
  ${env.extra_scripts}
  extra_scripts/nrf52_extra.py
build_src_filter = -<*> +<../tools/lr1121_osc_probe/main.cpp> +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo/variant.cpp>
lib_deps =
  # renovate: datasource=github-tags depName=RadioLib packageName=jgromes/RadioLib
  https://github.com/jgromes/RadioLib/archive/6d8934836678d8894e3d556550475b37dce3e2b6.zip
debug_tool = jlink
