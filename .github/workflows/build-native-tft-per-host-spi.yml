name: build-native-tft-per-host-spi

# Dedicated build branch, not for main. The checkout pins the firmware commit
# under test; PlatformIO resolves the framework-portduino and LovyanGFX pins
# already present in variants/native/portduino.ini.
#
#   firmware:            #12309 head c2259b4e71c827a7f0b9711254dc7f7b1431c67c (lgfx_borrow_spiclass)
#                        merged with #12311 head 3fa32a866fb18559d826805407920ee882e47c67 (Display.DataBits)
#   framework-portduino: NomDeTom/framework-portduino 248677084a8315a37e7762f763283f1dada23298 (#81)
#   LovyanGFX:           NomDeTom/LovyanGFX 27a3803f838463263cc4c5d415ae3d4a30196ef8 (portduino-batch-borrow:
#                        batching 3b246ff + the #998 borrow hook)
#   device-ui:           NomDeTom/device-ui 29dc3ccf94fc3f4836124ea4352c5d973710ad00 (map missing-once)

on:
  workflow_dispatch:
  push:
    branches:
      - build/native-tft-per-host-spi
      - build/native-tft-per-host-spi-batch
      - build/native-tft-per-host-spi-map-log
      - build/native-tft-borrow

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2259b4e71c827a7f0b9711254dc7f7b1431c67c
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - name: Build native-tft in armhf Debian trixie
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates git python3 python3-pip python3-venv \
                pkg-config cmake lsb-release tar gzip openssl \
                python3-protobuf python3-grpcio \
                libgpiod-dev libyaml-cpp-dev libjsoncpp-dev libbluetooth-dev \
                libsdbus-c++-dev libusb-1.0-0-dev libi2c-dev libuv1-dev \
                libssl-dev libulfius-dev liborcania-dev libavahi-client-dev \
                libx11-dev libinput-dev libxkbcommon-dev libxkbcommon-x11-dev \
                libsqlite3-dev libsdl2-dev libcurl4-gnutls-dev libnotify-dev \
                libbsd-dev libudev-dev

              pip3 install --break-system-packages "platformio==6.1.18"
              git config --global --add safe.directory /work

              test "$(git rev-parse HEAD)" = "c2259b4e71c827a7f0b9711254dc7f7b1431c67c"
              git -c user.name=build -c user.email=build@localhost merge --no-edit 3fa32a866fb18559d826805407920ee882e47c67
              grep -q "framework-portduino@https://github.com/NomDeTom/framework-portduino.git#248677084a8315a37e7762f763283f1dada23298" variants/native/portduino.ini
              sed -i "s#LovyanGFX/archive/5b13f8d328d5833ba8bcae381e8bc6a5db452703.zip#LovyanGFX/archive/27a3803f838463263cc4c5d415ae3d4a30196ef8.zip#" variants/native/portduino.ini
              grep -q "LovyanGFX/archive/27a3803f838463263cc4c5d415ae3d4a30196ef8.zip" variants/native/portduino.ini
              sed -i "s#meshtastic/device-ui/archive/a5b80d4d5708d0563ea9e0c0277dc8984e2fb952.zip#NomDeTom/device-ui/archive/29dc3ccf94fc3f4836124ea4352c5d973710ad00.zip#" platformio.ini
              grep -q "NomDeTom/device-ui/archive/29dc3ccf94fc3f4836124ea4352c5d973710ad00.zip" platformio.ini
              grep -q "displayPanelUses16BitData" src/graphics/tftSetup.cpp
              grep -q "lgfx_borrow_spiclass" src/platform/portduino/PortduinoGlue.cpp

              {
                echo "firmware=#12309 c2259b4e71c827a7f0b9711254dc7f7b1431c67c + #12311 3fa32a866fb18559d826805407920ee882e47c67"
                echo "framework-portduino=248677084a8315a37e7762f763283f1dada23298"
                echo "LovyanGFX=27a3803f838463263cc4c5d415ae3d4a30196ef8"
                echo "databits=Display.DataBits override available; ILI9488 default 18-bit"
                echo "lovyangfx_branch=portduino-batch-borrow (batching + lgfx_borrow_spiclass)"
                echo "device-ui=29dc3ccf94fc3f4836124ea4352c5d973710ad00 (map missing-once)"
              } | tee build-pins.txt
              git rev-parse HEAD | tee firmware-commit.txt

              pio run -e native-tft -j 1
              pio pkg list -e native-tft | grep -Ei "framework-portduino|LovyanGFX" | tee -a build-pins.txt || true
            '

      - uses: actions/upload-artifact@v4
        with:
          name: meshtasticd-armhf-borrow
          path: |
            .pio/build/native-tft/meshtasticd
            firmware-commit.txt
            build-pins.txt
          if-no-files-found: error
