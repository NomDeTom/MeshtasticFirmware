name: build-native-tft-per-host-spi

# Dedicated build branch, not for main. The checkout pins the firmware commit
# under test; PlatformIO resolves the framework-portduino and LovyanGFX pins
# already present in variants/native/portduino.ini.
#
#   firmware:            #12309 head 4ee69125719f69d060a26fa2079696a4fd644dc0
#                        merged with #12311 head dee6041e6af1f3dc3ef63883025176a19d139e3c (Display.DataBits)
#   framework-portduino: NomDeTom/framework-portduino e8ac5f4fc23623740d7883d2224b095608e02462
#   LovyanGFX:           NomDeTom/LovyanGFX 3b246ff4491242b6f198321fe5101921803fdb99 (portduino-batch-write)

on:
  workflow_dispatch:
  push:
    branches:
      - build/native-tft-per-host-spi
      - build/native-tft-per-host-spi-batch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ee69125719f69d060a26fa2079696a4fd644dc0
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - name: Build native-tft in armhf Debian trixie
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates git python3 python3-pip python3-venv \
                pkg-config cmake lsb-release tar gzip openssl \
                python3-protobuf python3-grpcio \
                libgpiod-dev libyaml-cpp-dev libjsoncpp-dev libbluetooth-dev \
                libsdbus-c++-dev libusb-1.0-0-dev libi2c-dev libuv1-dev \
                libssl-dev libulfius-dev liborcania-dev libavahi-client-dev \
                libx11-dev libinput-dev libxkbcommon-dev libxkbcommon-x11-dev \
                libsqlite3-dev libsdl2-dev libcurl4-gnutls-dev libnotify-dev \
                libbsd-dev libudev-dev

              pip3 install --break-system-packages "platformio==6.1.18"
              git config --global --add safe.directory /work

              test "$(git rev-parse HEAD)" = "4ee69125719f69d060a26fa2079696a4fd644dc0"
              git -c user.name=build -c user.email=build@localhost merge --no-edit dee6041e6af1f3dc3ef63883025176a19d139e3c
              grep -q "framework-portduino@https://github.com/NomDeTom/framework-portduino.git#e8ac5f4fc23623740d7883d2224b095608e02462" variants/native/portduino.ini
              sed -i "s#LovyanGFX/archive/16ea078853516bcb49cba133fbfa6d7007fa15ef.zip#LovyanGFX/archive/3b246ff4491242b6f198321fe5101921803fdb99.zip#" variants/native/portduino.ini
              grep -q "LovyanGFX/archive/3b246ff4491242b6f198321fe5101921803fdb99.zip" variants/native/portduino.ini
              grep -q "displayPanelUses16BitData" src/graphics/tftSetup.cpp

              {
                echo "firmware=#12309 4ee69125719f69d060a26fa2079696a4fd644dc0 + #12311 dee6041e6af1f3dc3ef63883025176a19d139e3c"
                echo "framework-portduino=e8ac5f4fc23623740d7883d2224b095608e02462"
                echo "LovyanGFX=3b246ff4491242b6f198321fe5101921803fdb99"
                echo "databits=Display.DataBits override available; ILI9488 default 18-bit"
                echo "lovyangfx_branch=portduino-batch-write"
              } | tee build-pins.txt
              git rev-parse HEAD | tee firmware-commit.txt

              pio run -e native-tft -j 1
              pio pkg list -e native-tft | grep -Ei "framework-portduino|LovyanGFX" | tee -a build-pins.txt || true
            '

      - uses: actions/upload-artifact@v4
        with:
          name: meshtasticd-armhf-per-host-spi-batch
          path: |
            .pio/build/native-tft/meshtasticd
            firmware-commit.txt
            build-pins.txt
          if-no-files-found: error
