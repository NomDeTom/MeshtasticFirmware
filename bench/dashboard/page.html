<!doctype html>
<meta charset="utf-8" />
<title>bench status</title>
<style>
  :root {
    --bg: #f6f7f9;
    --fg: #141a22;
    --mut: #5a6673;
    --rule: #dce1e7;
    --card: #fff;
    --ok: #1e7a5f;
    --bad: #a8541e;
    --warn: #8a6d1f;
    --accent: #1f5f8b;
  }
  /* Three states, not two: an explicit choice stamps data-theme on the root, and the
   default "system" setting stamps nothing - so the media query has to be guarded, or a
   reader who picks light on a dark OS gets dark anyway. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419;
      --fg: #e4e8ed;
      --mut: #9aa5b1;
      --rule: #242d37;
      --card: #161c23;
      --ok: #4fbf97;
      --bad: #e08a4a;
      --warn: #d4b352;
      --accent: #5aa9db;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419;
    --fg: #e4e8ed;
    --mut: #9aa5b1;
    --rule: #242d37;
    --card: #161c23;
    --ok: #4fbf97;
    --bad: #e08a4a;
    --warn: #d4b352;
    --accent: #5aa9db;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.5 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.1rem;
    margin: 0 0 0.2rem;
    letter-spacing: 0.02em;
  }
  h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--mut);
    margin: 1.6rem 0 0.5rem;
    font-weight: 600;
  }
  .sub {
    color: var(--mut);
    margin: 0 0 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.8rem 1rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 0.7rem;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.85rem;
  }
  th {
    text-align: left;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--mut);
    border-bottom: 1px solid var(--rule);
    padding: 0.4rem 0.5rem;
  }
  td {
    padding: 0.4rem 0.5rem;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  .pill {
    display: inline-block;
    padding: 0.05em 0.45em;
    border-radius: 3px;
    font-size: 0.72rem;
    font-weight: 600;
    border: 1px solid currentColor;
  }
  .PASS,
  .RUNNING,
  .FINISHED {
    color: var(--ok);
  }
  .FAIL,
  .DIED,
  .FAILED {
    color: var(--bad);
  }
  .INVALID {
    color: var(--bad);
  }
  [class~="NOT"] {
    color: var(--warn);
  }
  .warnrow {
    color: var(--warn);
  }
  pre {
    margin: 0;
    white-space: pre-wrap;
    font-size: 0.8rem;
    color: var(--mut);
    max-height: 16rem;
    overflow: auto;
  }
  .k {
    color: var(--mut);
  }
  .big {
    font-size: 1.35rem;
    font-weight: 600;
  }
  .wait {
    border-left: 3px solid var(--accent);
    padding-left: 0.7rem;
  }
  .runs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0 0 0.7rem;
  }
  .tabs {
    display: flex;
    gap: 0.3rem;
    margin: 0.2rem 0 0.4rem;
    border-bottom: 1px solid var(--rule);
  }
  .tab {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--mut);
    cursor: pointer;
    font: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 0.8rem;
  }
  .tab:hover {
    color: var(--fg);
  }
  .tab[aria-current="true"] {
    color: var(--fg);
    border-bottom-color: var(--accent);
  }
  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  [data-panel][hidden] {
    display: none;
  }
  .bar {
    height: 6px;
    background: var(--rule);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 0.3rem;
  }
  .bar i {
    display: block;
    height: 100%;
    background: var(--accent);
  }
  .bar i.over {
    background: var(--bad);
  }
  .step {
    border-bottom: 1px solid var(--rule);
    padding: 0.25rem 0;
  }
  .step:last-child {
    border-bottom: 0;
  }
  .step > summary {
    cursor: pointer;
    display: flex;
    gap: 0.55rem;
    align-items: baseline;
    list-style: none;
    padding: 0.15rem 0;
  }
  .step > summary::-webkit-details-marker {
    display: none;
  }
  .step > summary::before {
    content: "▸";
    color: var(--mut);
    width: 0.8em;
    flex: none;
    transition: transform 0.12s;
  }
  .step[open] > summary::before {
    transform: rotate(90deg);
  }
  .step.leaf > summary::before {
    content: "";
  }
  .step .nm {
    flex: 1;
    min-width: 0;
  }
  .step .bud {
    color: var(--mut);
    font-variant-numeric: tabular-nums;
  }
  .kids {
    margin: 0.15rem 0 0.35rem 1.6rem;
    border-left: 1px solid var(--rule);
    padding-left: 0.7rem;
  }
  .kid {
    display: flex;
    gap: 0.55rem;
    align-items: baseline;
    padding: 0.12rem 0;
    font-size: 0.82rem;
  }
  .mark {
    width: 5.4rem;
    flex: none;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .m-planned {
    color: var(--mut);
  }
  .m-running {
    color: var(--accent);
  }
  .m-done {
    color: var(--ok);
  }
  .m-skipped {
    color: var(--mut);
    opacity: 0.7;
  }
  .m-failed {
    color: var(--bad);
  }
  .m-overdue {
    color: var(--warn, #b26a00);
    font-weight: 600;
  }
  @keyframes late {
    50% {
      opacity: 0.45;
    }
  }
  .m-overdue {
    animation: late 1.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .m-overdue {
      animation: none;
    }
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin: 0 0 0.5rem;
  }
  .tailnote {
    margin: 0 0 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
  }
  .chip {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--mut);
    cursor: pointer;
    font: inherit;
    font-size: 0.76rem;
    padding: 0.15rem 0.6rem;
  }
  .chip[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--fg);
  }
  .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .top {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }
  .top > div {
    flex: 1;
    min-width: 0;
  }
  #theme {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--mut);
    cursor: pointer;
    font: inherit;
    font-size: 0.78rem;
    padding: 0.25rem 0.6rem;
    flex: none;
    white-space: nowrap;
  }
  #theme:hover {
    color: var(--fg);
    border-color: var(--rule-strong, var(--mut));
  }
  #theme:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .started {
    color: var(--mut);
    font-size: 0.78rem;
    font-weight: 400;
    margin-left: 0.6rem;
  }
  .run {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    font-size: 0.8rem;
    color: inherit;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
  }
  .run:hover {
    border-color: var(--rule-strong);
  }
  .run[aria-current="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .run small {
    color: var(--mut);
  }
  .run:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
<div class="wrap">
  <div class="top">
    <div>
      <h1>bench status<span class="started" id="started"></span></h1>
    </div>
    <button id="theme" type="button" title="cycle: system, light, dark">
      theme
    </button>
  </div>
  <div id="runs" class="runs"></div>
  <p class="sub" id="ident">loading&hellip;</p>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="overview" aria-current="true">
      overview
    </button>
    <button class="tab" data-tab="schedule">schedule</button>
    <button class="tab" data-tab="devices">devices</button>
  </nav>
  <div class="card wait" id="wait" hidden></div>
  <div data-panel="overview">
    <h2>position</h2>
    <div class="grid" id="pos"></div>
    <h2>rows</h2>
    <div class="card">
      <table id="rows">
        <thead>
          <tr>
            <th>row</th>
            <th>verdict</th>
            <th>evidence</th>
            <th>image</th>
            <th>s</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div data-panel="schedule" hidden>
    <h2>planned schedule</h2>
    <p class="sub" id="planline">no schedule yet</p>
    <div class="card" id="plan"></div>
  </div>

  <div data-panel="devices" hidden>
    <h2>devices</h2>
    <p class="sub" id="devnote"></p>
    <div class="card" id="ports"></div>
    <h2>images</h2>
    <div class="card">
      <table id="imgs">
        <thead>
          <tr>
            <th>bake</th>
            <th>env</th>
            <th>flash</th>
            <th>ram</th>
            <th>build s</th>
            <th>release-repr</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <h2>nodes</h2>
    <div class="card">
      <table id="nodes">
        <thead>
          <tr>
            <th>node</th>
            <th>role</th>
            <th>port</th>
            <th>mode</th>
            <th>state</th>
            <th>pkts</th>
            <th>logs</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div data-panel="overview">
    <h2>capture</h2>
    <div class="card">
      <table id="cap">
        <thead>
          <tr>
            <th>stream</th>
            <th>rows</th>
            <th>bytes</th>
            <th>last</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <h2 id="tail-head">tail</h2>
    <div class="chips" id="tailchips"></div>
    <div class="card">
      <div id="tailnote" class="tailnote"></div>
      <pre id="tail"></pre>
    </div>
  </div>
</div>
<script>
  const $ = (s) => document.querySelector(s);

  // Theme cycles system -> light -> dark. "system" stamps nothing, which is what lets
  // prefers-color-scheme still apply; the other two stamp the root so an explicit choice
  // beats the OS in both directions. Kept per browser, and applied before the first paint
  // so the page does not flash the wrong ground.
  const THEMES = ["system", "light", "dark"];
  function applyTheme(name) {
    try {
      localStorage.setItem("bench-theme", name);
    } catch (e) {
      /* private window */
    }
    if (name === "system")
      document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", name);
    const btn = $("#theme");
    if (btn)
      btn.textContent = name === "system" ? "theme: auto" : "theme: " + name;
  }
  let THEME = "system";
  try {
    THEME = localStorage.getItem("bench-theme") || "system";
  } catch (e) {
    /* ignore */
  }
  applyTheme(THEME);
  $("#theme").onclick = () => {
    THEME = THEMES[(THEMES.indexOf(THEME) + 1) % THEMES.length];
    applyTheme(THEME);
  };
  // Which run is being shown. null = whichever is most recently active, which is what an
  // unattended watcher wants by default: the thing happening now.
  let RUN = new URLSearchParams(location.search).get("run");
  const q = (p) => (RUN ? `${p}?run=${encodeURIComponent(RUN)}` : p);
  let TAB = new URLSearchParams(location.search).get("tab") || "overview";
  // Which nodes the tail shows. null means "all", an empty Set means "none" - the two are
  // different questions and both are worth being able to ask.
  let TAILNODES = null;
  // Which <details> the reader has opened, by id. The page redraws on a timer and would
  // otherwise collapse a section a second or two after it was opened.
  const OPEN = new Set();

  function keepOpenState(root) {
    root.querySelectorAll("details[data-id]").forEach((d) => {
      if (OPEN.has(d.dataset.id)) d.open = true;
      d.addEventListener("toggle", () => {
        d.open ? OPEN.add(d.dataset.id) : OPEN.delete(d.dataset.id);
      });
    });
  }

  function showTab(name) {
    TAB = name;
    document.querySelectorAll("[data-panel]").forEach((el) => {
      el.hidden = el.dataset.panel !== name;
    });
    document.querySelectorAll(".tab").forEach((b) => {
      b.setAttribute("aria-current", String(b.dataset.tab === name));
    });
    const u = new URLSearchParams(location.search);
    u.set("tab", name);
    if (RUN) u.set("run", RUN);
    history.replaceState(null, "", "?" + u.toString());
  }
  document.querySelectorAll(".tab").forEach((b) => {
    b.onclick = () => showTab(b.dataset.tab);
  });
  showTab(TAB);
  const esc = (v) =>
    String(v ?? "").replace(
      /[&<>]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
    );
  const cell = (v) =>
    v === null || v === undefined ? "<span class=k>-</span>" : esc(v);
  const secs = (v) =>
    v === null || v === undefined ? "-" : Math.round(v) + "s";

  function rows(id, data, cols) {
    const body = $(id).querySelector("tbody");
    body.innerHTML =
      data
        .map(
          (d) =>
            "<tr>" +
            cols.map((c) => "<td>" + c(d) + "</td>").join("") +
            "</tr>",
        )
        .join("") || "<tr><td colspan=9 class=k>nothing yet</td></tr>";
  }

  function drawRuns(runs) {
    const box = $("#runs");
    if (!runs || !runs.length) {
      box.innerHTML = "<span class=k>no runs yet</span>";
      return;
    }
    box.innerHTML = runs
      .map((r) => {
        const cur = RUN ? r.name === RUN : r === runs[0];
        const pos = r.total ? `${r.done}/${r.total}` : r.stage || "";
        return `<button class=run role=link aria-current="${cur}" data-run="${esc(r.name)}">
      <b>${esc(r.name)}</b>
      <span class="pill ${esc((r.status || "").split(" ")[0])}">${esc(r.status)}</span>
      <small>${esc(pos)}</small></button>`;
      })
      .join("");
    box.querySelectorAll(".run").forEach(
      (b) =>
        (b.onclick = () => {
          RUN = b.dataset.run;
          history.replaceState(null, "", `?run=${encodeURIComponent(RUN)}`);
          refresh();
        }),
    );
  }

  async function refresh() {
    let s;
    try {
      s = await (await fetch(q("status.json"), { cache: "no-store" })).json();
    } catch (e) {
      $("#ident").textContent = "status unavailable - is the server still up?";
      return;
    }
    drawRuns(s.runs);
    if (s.runs && !s.runs.length) {
      $("#ident").textContent =
        "waiting for a run to appear under " + esc(s.root || "");
      return;
    }

    const id = s.identity || {},
      p = s.position || {},
      c = s.counts || {};
    if (s.server_started_at) {
      const t = new Date(s.server_started_at * 1000);
      const up = Math.max(
        0,
        Math.round(Date.now() / 1000 - s.server_started_at),
      );
      const h = Math.floor(up / 3600),
        m = Math.floor((up % 3600) / 60);
      $("#started").textContent =
        ` · bench process started ${t.toLocaleString()} (up ${h}h${String(m).padStart(2, "0")}m)`;
    }
    $("#ident").innerHTML =
      `<span class="pill ${esc(s.status)}">${esc(s.status)}</span> ` +
      `${cell(id.git && id.git.sha)}${id.git && id.git.dirty ? " <span class=warnrow>(dirty)</span>" : ""} &middot; ` +
      `${cell((id.platform || {}).os)} &middot; ${cell(id.operator_note || "no note")}`;

    const w = s.waiting || {};
    $("#wait").hidden = !w.for;
    if (w.for)
      $("#wait").innerHTML =
        `waiting for <b>${esc(w.for)}</b>, ${secs(w.seconds)}`;

    $("#pos").innerHTML = [
      ["stage", p.stage, ""],
      ["row", p.row || "-", `${p.done ?? 0} / ${p.total ?? 0} done`],
      [
        "elapsed",
        secs(p.elapsed_s),
        p.expected_stage_s ? "stage median " + secs(p.expected_stage_s) : "",
      ],
      [
        "pass / fail",
        `${c.PASS || 0} / ${c.FAIL || 0}`,
        `${c["NOT OBSERVED"] || 0} not-observed, ${c.INVALID || 0} invalid` +
          (s.carried_over
            ? ` &middot; ${s.carried_over} carried from an earlier attempt`
            : ""),
      ],
      ["heartbeat", secs(s.heartbeat_age_s) + " ago", ""],
      [
        "planned",
        secs(p.planned_total_s),
        p.over_plan ? "OVER PLAN" : "worst case for this table",
      ],
    ]
      .map(
        ([
          k,
          v,
          sub,
        ]) => `<div class="card"><div class=k>${k}</div><div class=big>${cell(v)}</div>
     <div class=k>${esc(sub)}</div></div>`,
      )
      .join("");

    rows("#rows", s.rows || [], [
      (d) => esc(d.id),
      (d) =>
        `<span class="pill ${esc((d.verdict || "").split(" ")[0])}">${esc(d.verdict)}</span>` +
        (d.pending_retry
          ? ` <span class=k title="queued for a retry; last attempt was ${esc(d.previous_verdict || "")}">retrying</span>`
          : d.carried_over
            ? ` <span class=k title="banked by an earlier attempt at this run id, not measured now">carried</span>`
            : "") +
        (d.release_representative === false
          ? " <span class=warnrow>bench-only</span>"
          : ""),
      (d) =>
        d.error
          ? `<span class=FAIL>${esc(d.error)}</span>`
          : (d.outcomes || [])
              .map((o) => `${esc(o.name)}: ${esc(o.evidence)}`)
              .join("<br>") || "<span class=k>-</span>",
      (d) =>
        Object.values(d.images || {})
          .map(esc)
          .join(" ") || "-",
      (d) => secs(d.duration_s),
    ]);

    rows("#imgs", s.images || [], [
      (d) => esc(d.bake_hash),
      (d) => esc(d.env),
      (d) => (d.flash_pct != null ? d.flash_pct + "%" : "-"),
      (d) => (d.ram_pct != null ? d.ram_pct + "%" : "-"),
      (d) => secs(d.duration_s),
      (d) =>
        d.release_representative
          ? "yes"
          : `<span class=warnrow>no (${esc((d.bench_only_flags || []).join(","))})</span>`,
    ]);

    const obs = (s.observer || {}).nodes || {};
    rows("#nodes", s.nodes || [], [
      (d) => esc(d.name),
      (d) => esc(d.role),
      (d) => cell(d.port),
      (d) => esc((obs[d.name] || {}).mode || (d.never_command ? "raw" : "api")),
      (d) => {
        const o = obs[d.name] || {};
        if (o.connected) return "<span class=PASS>connected</span>";
        if (o.dropped_for_s != null)
          return `<span class=FAIL>dropped ${secs(o.dropped_for_s)}</span>`;
        return d.port
          ? "<span class=k>present</span>"
          : "<span class=FAIL>absent</span>";
      },
      (d) => cell((obs[d.name] || {}).packets),
      (d) => cell((obs[d.name] || {}).log_lines),
    ]);

    // --- schedule tab ---------------------------------------------------------
    const plan = s.schedule;
    if (plan && plan.steps) {
      const done = p.elapsed_s || 0,
        total = plan.total_s || 0;
      const pct = total ? Math.min(100, (100 * done) / total) : 0;
      const c = plan.counts || {};
      $("#planline").innerHTML =
        `worst case <b>${secs(total)}</b> (${Math.round(total / 60)} min) &middot; ` +
        `elapsed ${secs(done)} &middot; ` +
        `<span class=m-done>${c.done || 0} done</span> &middot; ` +
        `<span class=m-skipped>${c.skipped || 0} skipped</span> &middot; ` +
        `<span class=m-planned>${c.planned || 0} planned</span>` +
        (c.failed
          ? ` &middot; <span class=m-failed>${c.failed} failed</span>`
          : "") +
        (c.overdue
          ? ` &middot; <span class=m-overdue>${c.overdue} overdue</span>`
          : "") +
        (p.over_plan ? " &middot; <span class=FAIL>OVER PLAN</span>" : "") +
        `<div class=bar><i class="${p.over_plan ? "over" : ""}" style="width:${pct}%"></i></div>`;

      // A skipped step spent none of its budget, so the total is a ceiling. Showing
      // elapsed against budget per step is where that difference becomes readable.
      const timing = (st) => {
        if (st.elapsed_s == null)
          return `<span class=bud>${secs(st.budget_s)}</span>`;
        const over = st.overran ? " FAIL" : "";
        return `<span class="bud${over}">${secs(st.elapsed_s)} / ${secs(st.budget_s)}</span>`;
      };
      // Overdue is derived server-side from elapsed against budget, so it reads the same
      // here as it does in the JSON an unattended run leaves behind.
      const mark = (st) =>
        `<span class="mark m-${esc(st.status)}">${esc(st.status)}` +
        (st.over_by_s ? ` +${secs(st.over_by_s)}` : "") +
        `</span>`;

      $("#plan").innerHTML = plan.steps
        .map((st) => {
          const kids = st.children || [];
          const openNow = st.status === "running" || st.status === "overdue";
          const body = kids
            .map(
              (k) =>
                `<div class=kid>${mark(k)}<span class=nm>${esc(k.name)}</span>${timing(k)}
         <span class=k>${esc(k.outcome || k.detail || "")}</span></div>`,
            )
            .join("");
          if (openNow) OPEN.add(st.id);
          return `<details class="step${kids.length ? "" : " leaf"}" data-id="${esc(st.id)}"${OPEN.has(st.id) ? " open" : ""}>
        <summary>${mark(st)}<span class=nm>${esc(st.name)}</span>${timing(st)}
          <span class=k>${esc(st.outcome || st.detail || "")}</span></summary>
        ${kids.length ? `<div class=kids>${body}</div>` : ""}
      </details>`;
        })
        .join("");
      keepOpenState($("#plan"));
    } else {
      $("#planline").textContent = "no schedule recorded for this run";
      $("#plan").innerHTML = "";
    }

    // --- devices tab ----------------------------------------------------------
    const pstate = s.ports || {};
    const anyStale = (s.devices || []).some((d) => d.stale);
    $("#devnote").innerHTML = anyStale
      ? "USB presence is live. Port state, reconnects and firmware are what the last run " +
        "recorded and are <b>not current</b> - no run is holding these devices now."
      : "Live, from the run currently holding these devices.";

    $("#ports").innerHTML =
      (s.devices || [])
        .map((d) => {
          // Live presence and remembered port state are different claims, so they are shown
          // as different things. A finished run's last port state is history, not status.
          const presence = d.present
            ? `<span class="mark m-done">present</span>`
            : `<span class="mark m-failed">absent</span>`;
          const recorded = d.recorded_state
            ? d.stale
              ? `<span class=k>was ${esc(d.recorded_state)}${d.as_of_s ? " " + secs(d.as_of_s) + " ago" : ""}</span>`
              : `<span class="${["gave_up", "lost", "absent"].includes(d.recorded_state) ? "FAIL" : "PASS"}">${esc(d.recorded_state)}</span>`
            : `<span class=k>no run has held this device</span>`;

          const board = d.observed_model
            ? d.board_matches === false
              ? `<span class=FAIL>${esc(d.observed_model)} &mdash; table says ${esc(d.declared_board)}</span>`
              : esc(d.observed_model)
            : `<span class=k>${esc(d.declared_board || "unknown")} (declared; not yet read from the device)</span>`;

          const facts = [
            ["hardware", board],
            ["node id", cell(d.node_id)],
            ["firmware", cell(d.firmware)],
            ["usb serial", cell(d.serial_number)],
            ["port now", cell(d.port)],
            ["role", cell(d.role)],
            ["capture", cell(d.capture)],
            [
              "policy",
              (d.never_command ? "never commanded" : "commanded") +
                ", " +
                (d.never_flash ? "never flashed" : "flashable"),
            ],
            ["port state", recorded],
            ["reconnects", cell(d.reconnects)],
            [
              "last error",
              d.last_error
                ? `<span class=warnrow>${esc(d.last_error)}</span>`
                : "-",
            ],
          ];
          return `<details class=step data-id="dev:${esc(d.node)}"${OPEN.has("dev:" + d.node) ? " open" : ""}>
      <summary>${presence}<span class=nm><b>${esc(d.node)}</b></span>
        <span class=bud>${esc(d.port || "-")}</span>
        <span class=k>${esc(d.observed_model || d.declared_board || "")}</span></summary>
      <div class=kids>${facts
        .map(
          ([k, v]) =>
            `<div class=kid><span class="mark m-planned">${k}</span><span class=nm>${v}</span></div>`,
        )
        .join("")}</div></details>`;
        })
        .join("") || "<span class=k>no devices</span>";
    keepOpenState($("#ports"));

    const cap = (s.capture || {}).streams || {};
    rows(
      "#cap",
      Object.entries(cap).map(([k, v]) => ({ name: k, ...v })),
      [
        (d) => esc(d.name),
        (d) => cell(d.rows),
        (d) => cell(d.bytes),
        (d) =>
          d.age_s == null
            ? "<span class=k>never</span>"
            : d.age_s > 120
              ? `<span class=FAIL>${secs(d.age_s)} ago</span>`
              : secs(d.age_s) + " ago",
      ],
    );

    try {
      const t = await (
        await fetch(q("tail.json"), { cache: "no-store" })
      ).json();
      const b = t.build || {};
      // While an image is compiling there is nothing in the firmware streams; the build
      // log is the only thing that shows the run is still moving.
      if (p.stage === "1-build" && (b.lines || []).length) {
        $("#tail-head").textContent =
          `build log · ${b.bake_hash} · ${b.total_lines} lines · ${b.bytes} bytes`;
        $("#tailchips").innerHTML = "";
        $("#tail").textContent = b.lines.join("\n");
      } else {
        $("#tail-head").textContent = "tail";
        const logs = t.logs || [];
        // Every device the run knows about gets a chip, not only those that happen to
        // have spoken. A node in DFU emits nothing, and dropping it from the filter made
        // it invisible exactly when the operator most wanted to know where it was.
        const src = t.sources || {};
        const nodes = [
          ...new Set([
            ...logs.map((r) => r.node).filter(Boolean),
            ...Object.keys(src),
          ]),
        ].sort();
        const on = (n) => TAILNODES === null || TAILNODES.has(n);
        $("#tailchips").innerHTML =
          `<button class=chip data-pick="all" aria-pressed="${TAILNODES === null}">all</button>` +
          `<button class=chip data-pick="none" aria-pressed="${TAILNODES !== null && TAILNODES.size === 0}">none</button>` +
          nodes
            .map((n) => {
              const q = (src[n] || {}).lines === 0 || !(src[n] || {}).lines;
              const why = (src[n] || {}).state
                ? ` · ${esc((src[n] || {}).state)}`
                : "";
              return `<button class=chip data-pick="${esc(n)}" aria-pressed="${on(n)}"
            title="${esc(n)}${why}">${esc(n)}${q ? " <span class=k>(quiet)</span>" : ""}</button>`;
            })
            .join("");
        $("#tailchips")
          .querySelectorAll(".chip")
          .forEach(
            (btn) =>
              (btn.onclick = () => {
                const pick = btn.dataset.pick;
                if (pick === "all") TAILNODES = null;
                else if (pick === "none") TAILNODES = new Set();
                else {
                  if (TAILNODES === null) TAILNODES = new Set(nodes);
                  TAILNODES.has(pick)
                    ? TAILNODES.delete(pick)
                    : TAILNODES.add(pick);
                }
                refresh();
              }),
          );
        const shown = logs.filter((r) => on(r.node));
        $("#tail").textContent =
          shown
            .slice(-25)
            .map(
              (r) =>
                `${(r.node || "-").padEnd(9)} ${(r.line || r.msg || "").slice(0, 150)}`,
            )
            .join("\n") ||
          (TAILNODES && TAILNODES.size === 0
            ? "no devices selected"
            : "no lines yet");
        // Name the quiet devices and say where they are, rather than leaving the operator
        // to read an empty pane as a fault.
        const quiet = nodes.filter((n) => on(n) && !(src[n] || {}).lines);
        $("#tailnote").innerHTML = quiet.length
          ? quiet
              .map((n) => {
                const i = src[n] || {};
                const where = i.state
                  ? `${esc(i.state)}${i.why ? " - " + esc(i.why) : ""}`
                  : "no port state recorded";
                return `<span class=k>${esc(n)}: nothing in this window · ${where}</span>`;
              })
              .join(" &nbsp; ")
          : "";
      }
    } catch (e) {
      $("#tail").textContent = "tail unavailable";
    }
  }
  refresh();
  setInterval(refresh, 3000);
</script>
